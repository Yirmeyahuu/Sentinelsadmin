{% load static %}
<script>
    document.title = "SENTINELS | Faculty Profile";
</script>

<div class="p-6 ml-20">
    <div class="bg-white/70 shadow-lg rounded-tl-4xl rounded-br-4xl p-6">
        <a href="javascript:void(0);" onclick="history.back();" class="inline-flex items-center text-blue-500 hover:text-blue-600 font-semibold transition-colors duration-100">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Profile Image Section -->
            <div class="flex flex-col items-center mb-8">
                <div class="relative">
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-sky-500 shadow-lg">
                        <img id="profilePreview" 
                             src="{% if faculty_data.profile_image %}{{ faculty_data.profile_image }}{% else %}{% static 'assets/img/Default Profile.jpg' %}{% endif %}" 
                             alt="Profile Picture"
                             class="w-full h-full object-cover">
                    </div>
                    <label for="profileImage" class="absolute bottom-0 right-0 bg-blue-500 p-2 rounded-full cursor-pointer hover:bg-blue-600 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                        <input type="file" id="profileImage" name="profile_image" class="hidden" accept="image/*" onchange="previewImage(this)">
                    </label>
                </div>
            </div>
            

            <!-- Personal Information Section -->
            <div class="grid md:grid-cols-2 gap-6">
                
                <!-- Faculty ID (Read Only) -->
                <div class="relative">
                    <label class="block text-sm font-bold text-blue-500 mb-1">Faculty ID</label>
                    <input type="text" value="{{ faculty_data.faculty_id }}" readonly
                        class="w-full p-3 bg-blue-500 text-white rounded-lg border border-white cursor-not-allowed">
                </div>

                <!-- Program (Read Only) -->
                <div class="relative">
                    <label class="block text-sm font-bold text-blue-500 mb-1">Program</label>
                    <input type="text" value="{{ faculty_data.program }}" readonly
                        class="w-full p-3 bg-blue-500 text-white rounded-lg border border-white cursor-not-allowed">
                </div>

                <!-- Semester (Read Only) -->
                <div class="relative">
                    <label class="block text-sm font-bold text-blue-500 mb-1">Semester</label>
                    <input type="text" value="{{ faculty_data.semester }}" readonly
                        class="w-full p-3 bg-blue-500 text-white rounded-lg border border-white cursor-not-allowed">
                </div>

                <!-- First Name -->
                <div class="relative">
                    <label class="block text-sm font-bold text-blue-500 mb-1">First Name</label>
                    <div class="relative">
                        <input type="text" id="first_name" name="first_name" value="{{ faculty_data.first_name }}"
                               class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                               readonly>
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="enableEdit('first_name')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="relative">
                    <label class="block text-sm font-bold text-blue-500 mb-1">Last Name</label>
                    <div class="relative">
                        <input type="text" id="last_name" name="last_name" value="{{ faculty_data.last_name }}"
                               class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                               readonly>
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="enableEdit('last_name')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Middle Initial -->
                <div class="relative">
                    <label class="block text-sm font-bold text-blue-500 mb-1">Middle Initial</label>
                    <div class="relative">
                        <input type="text" id="middle_initial" name="middle_initial" value="{{ faculty_data.middle_initial }}"
                               class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                               readonly>
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="enableEdit('middle_initial')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Single Logout Modal (removed duplicate) -->
            <div id="logoutModal" class="fixed inset-0 flex items-center justify-center z-50 hidden">
                <!-- Backdrop with blur effect -->
                <div class="fixed inset-0 backdrop-blur-sm bg-gray-900/70" onclick="closeLogoutModal()"></div>
                
                <!-- Modal Content -->
                <div class="bg-white p-8 rounded-lg shadow-xl w-96 text-center relative z-10">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">Confirm Logout</h2>
                    <p class="text-gray-600 mb-8 text-lg">Are you sure you want to logout?</p>
                    
                    <form id="logoutForm" method="POST" action="{% url 'faculty_logout' %}" class="space-y-4">
                        {% csrf_token %}
                        <div class="flex justify-center space-x-4">
                            <!-- Styled like Save Changes button -->
                            <button type="submit"
                                class="bg-blue-500 text-white px-8 py-3 rounded-lg hover:bg-blue-600 cursor-pointer transition-all duration-200 font-semibold text-lg shadow-md hover:shadow-lg">
                                Logout
                            </button>
                            <button type="button"
                                onclick="closeLogoutModal()"
                                class="bg-gray-200 text-gray-800 px-8 py-3 rounded-lg hover:bg-gray-300 cursor-pointer transition-all duration-200 font-semibold text-lg shadow-md hover:shadow-lg">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end mt-6 space-x-4">
                <button type="button" 
                    onclick="openLogoutModal()" 
                    class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 cursor-pointer transition-colors">
                    Logout
                </button>
                <button type="submit" 
                    class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600 cursor-pointer transition-colors">
                    Save Changes
                </button>
            </div>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('profilePreview').src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
    }
}
</script>
