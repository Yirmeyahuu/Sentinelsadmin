{% extends 'Faculty/faculty-base.html' %}
{% load static %}

{% block content %}
<div class="p-6 ml-20">
    <div class="bg-blue-600 shadow-2xl rounded-2xl p-6">
        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <!-- Profile Image Section -->
            <div class="flex flex-col items-center mb-8">
                <div class="relative">
                    <div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-lg">
                        <img id="profilePreview" 
                             src="{% if faculty_data.profile_image %}{{ faculty_data.profile_image }}{% else %}{% static 'assets/img/Default Profile.jpg' %}{% endif %}" 
                             alt="Profile Picture"
                             class="w-full h-full object-cover">
                    </div>
                    <label for="profileImage" class="absolute bottom-0 right-0 bg-blue-500 p-2 rounded-full cursor-pointer hover:bg-blue-600 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                        </svg>
                        <input type="file" id="profileImage" name="profile_image" class="hidden" accept="image/*" onchange="previewImage(this)">
                    </label>
                </div>
            </div>
            

            <!-- Personal Information Section -->
            <div class="grid md:grid-cols-2 gap-6">
                
                <!-- Faculty ID (Read Only) -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">Faculty ID</label>
                    <input type="text" value="{{ faculty_data.faculty_id }}" readonly
                        class="w-full p-3 bg-blue-500/50 text-white/70 rounded-lg border border-blue-400 cursor-not-allowed">
                </div>

                <!-- Program (Read Only) -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">Program</label>
                    <input type="text" value="{{ faculty_data.program }}" readonly
                        class="w-full p-3 bg-blue-500/50 text-white/70 rounded-lg border border-blue-400 cursor-not-allowed">
                </div>

                <!-- Semester (Read Only) -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">Semester</label>
                    <input type="text" value="{{ faculty_data.semester }}" readonly
                        class="w-full p-3 bg-blue-500/50 text-white/70 rounded-lg border border-blue-400 cursor-not-allowed">
                </div>

                <!-- Create Password -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">Create Password</label>
                    <div class="relative">
                        <input type="password" id="faculty_password" name="faculty_password"
                            class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                            placeholder="Enter new password">
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="togglePassword('faculty_password')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </span>
                    </div>
                    <small class="text-gray-200">Leave blank if you do not want to change your password.</small>
                </div>

                <!-- First Name -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">First Name</label>
                    <div class="relative">
                        <input type="text" id="first_name" name="first_name" value="{{ faculty_data.first_name }}"
                               class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                               readonly>
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="enableEdit('first_name')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">Last Name</label>
                    <div class="relative">
                        <input type="text" id="last_name" name="last_name" value="{{ faculty_data.last_name }}"
                               class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                               readonly>
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="enableEdit('last_name')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </span>
                    </div>
                </div>

                <!-- Middle Initial -->
                <div class="relative">
                    <label class="block text-sm font-medium text-white mb-1">Middle Initial</label>
                    <div class="relative">
                        <input type="text" id="middle_initial" name="middle_initial" value="{{ faculty_data.middle_initial }}"
                               class="w-full p-3 pl-10 bg-blue-500 text-white rounded-lg border border-blue-400 focus:outline-none focus:border-white"
                               readonly>
                        <span class="absolute right-3 top-3 text-white cursor-pointer" onclick="enableEdit('middle_initial')">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
                            </svg>
                        </span>
                    </div>
                </div>

                
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end mt-6">
                <button type="submit" class="bg-white text-blue-600 px-6 py-2 rounded-lg hover:bg-blue-50 transition-colors">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('profilePreview').src = e.target.result;
        }
        reader.readAsDataURL(input.files[0]);
    }
}

// Enable editing for a specific field
function enableEdit(fieldId) {
    const input = document.getElementById(fieldId);
    input.removeAttribute('readonly');
    input.focus();
}

function togglePassword(fieldId) {
    const input = document.getElementById(fieldId);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
{% endblock %}
