{% extends 'Faculty/faculty-base.html' %}
{% load static %}

{% block content %}
<div class="p-6 flex justify-center">
    <div class="w-full max-w-6xl">
  
        <div class="flex flex-col items-center space-y-6 p-6 w-full max-w-7xl">
            <!-- Dashboard Cards Row -->
            <div class="flex space-x-10 ml-24">
                
              <!-- Total Users -->
              <div class="relative bg-blue-600 shadow-xl rounded-2xl p-6 w-[22rem] flex flex-col items-center overflow-hidden">
                <div class="absolute inset-0 opacity-30">
                  <svg class="w-full h-full" viewBox="0 0 200 200">
                    <path fill="none" stroke="#3B82F6" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                    <path fill="none" stroke="#FACC15" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                  </svg>
                </div>
                <div class="absolute -top-4 -left-6 w-20 h-20 bg-blue-900 blur-2xl opacity-90 rounded-full"></div>
                <div class="absolute bottom-0 right-2 w-24 h-24 bg-blue-700 blur-2xl opacity-90 rounded-full"></div>
          
                <h2 class="text-lg font-semibold text-white mb-4 z-10">Total Users</h2>
                <p class="text-4xl font-bold text-white z-10">1</p>
              </div>
          
              <!-- Active Users -->
              <div class="relative bg-green-500 shadow-xl rounded-2xl p-6 w-[22rem] flex flex-col items-center overflow-hidden">
                <div class="absolute inset-0 opacity-30">
                  <svg class="w-full h-full" viewBox="0 0 200 200">
                    <path fill="none" stroke="#34D399" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                    <path fill="none" stroke="#FACC15" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                  </svg>
                </div>
                <div class="absolute -top-4 -left-6 w-20 h-20 bg-green-800 blur-2xl opacity-90 rounded-full"></div>
                <div class="absolute bottom-0 right-2 w-24 h-24 bg-green-600 blur-2xl opacity-90 rounded-full"></div>
          
                <h2 class="text-lg font-semibold text-white mb-4 z-10">Active Users</h2>

                <div class="relative w-24 h-24">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" stroke="#ffffff" stroke-width="10" fill="transparent"/>
                        <circle id="progressCS" cx="50" cy="50" r="40" stroke="#3B82F6" stroke-width="10" fill="transparent"
                                stroke-dasharray="251.2" stroke-dashoffset="251.2"
                                stroke-linecap="round" />
                    </svg>
                    <div class="absolute inset-0 flex justify-center items-center text-lg font-bold text-white">
                        <span id="progressTextCS">0%</span>
                    </div>
                </div>
              </div>
          
              <!-- Inactive Users -->
              <div class="relative bg-red-400 shadow-xl rounded-2xl p-6 w-[22rem] flex flex-col items-center overflow-hidden">
                <div class="absolute inset-0 opacity-30">
                  <svg class="w-full h-full" viewBox="0 0 200 200">
                    <path fill="none" stroke="#EF4444" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                    <path fill="none" stroke="#FACC15" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                  </svg>
                </div>
                <div class="absolute -top-4 -left-6 w-20 h-20 bg-red-700 blur-2xl opacity-90 rounded-full"></div>
                <div class="absolute bottom-0 right-2 w-24 h-24 bg-red-600 blur-2xl opacity-90 rounded-full"></div>
          
                <h2 class="text-lg font-semibold text-white mb-4 z-10">Inactive Users</h2>
                <div class="relative w-24 h-24">
                    <svg class="w-full h-full" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" stroke="#ffffff" stroke-width="10" fill="transparent"/>
                        <circle id="progressCS" cx="50" cy="50" r="40" stroke="#3B82F6" stroke-width="10" fill="transparent"
                                stroke-dasharray="251.2" stroke-dashoffset="251.2"
                                stroke-linecap="round" />
                    </svg>
                    <div class="absolute inset-0 flex justify-center items-center text-lg font-bold text-white">
                        <span id="progressTextCS">0%</span>
                    </div>
                </div>
              </div>
            </div>
          </div>

    </div>
  </div>

<!-- Auto-Slide Script -->
<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('slider', () => ({
            activeSlide: 0,
            images: [
                `{% static 'assets/img/Photo1.png' %}`,
                `{% static 'assets/img/Photo2.png' %}`,
                `{% static 'assets/img/Photo3.png' %}`
            ],
            init() {
                setInterval(() => {
                    this.activeSlide = (this.activeSlide + 1) % this.images.length;
                }, 3000);
            }
        }));
    });
</script>

{% endblock %}
