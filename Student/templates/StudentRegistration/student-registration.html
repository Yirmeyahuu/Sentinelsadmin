{% extends 'Student/student-base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gray-100 from-blue-300 to-blue-600 flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-2xl overflow-hidden w-3/4 max-w-4xl flex">
        <!-- Left Column: Image or Content -->
        <div class="w-1/2 bg-blue-700 text-white flex flex-col items-center justify-center">
            <img src="{% static 'assets/img/login-bg.png' %}" alt="Student Login" class="w-full h-full object-cover">
        </div>

        <!-- Right Column: Login Form -->
        <div class="w-1/2 p-8 flex flex-col justify-center">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Student Registration</h2>
            <form action="{% url 'student_register' %}" method="POST" class="space-y-4">
                {% csrf_token %}
                <!-- ...existing code... -->
                <!-- Student ID -->
                <div class="relative">
                    <label for="student_id" class="block text-sm font-medium text-gray-700">Student ID <span> (required) </span></label>
                    <input type="text" id="student_id" name="student_id" required
                        class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <span class="absolute left-3 top-7 text-blue-700">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9h3m-3 3h3m-3 3h3m-6 1c-.306-.613-.933-1-1.618-1H7.618c-.685 0-1.312.387-1.618 1M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/>
                        </svg>                          
                    </span>
                </div>

                <!-- First Name -->
                <div class="relative">
                    <label for="first_name" class="block text-sm font-medium text-gray-700">First Name <span> (required) </span></label>
                    <input type="text" id="first_name" name="first_name" required
                        class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <span class="absolute left-3 top-7 text-blue-700">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                        </svg>                          
                    </span>
                </div>

                <!-- Last Name -->
                <div class="relative">
                    <label for="last_name" class="block text-sm font-medium text-gray-700">Last Name <span> (required) </span></label>
                    <input type="text" id="last_name" name="last_name" required
                        class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <span class="absolute left-3 top-7 text-blue-700">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                        </svg>                          
                    </span>
                </div>

                <!-- Middle Initial -->
                <div class="relative">
                    <label for="middle_initial" class="block text-sm font-medium text-gray-700">Middle Initial <span> (optional) </span></label>
                    <input type="text" id="middle_initial" name="middle_initial"
                        class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <span class="absolute left-3 top-7 text-blue-700">
                        <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-width="2" d="M7 17v1a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3Zm8-9a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                        </svg>                          
                    </span>
                </div>

                <!-- Program -->
                <div class="relative">
                    <label for="program" class="block text-sm font-medium text-gray-700">Program <span> (required) </span></label>
                    <select id="program" name="program" required
                            class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>-Select Option-</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                    </select>
                    <span class="absolute left-3 top-7 text-blue-600">
                        <svg class="w-[27px] h-[27px] text-blue-600 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.78552 9.5 12.7855 14l9-4.5-9-4.5-8.99998 4.5Zm0 0V17m3-6v6.2222c0 .3483 2 1.7778 5.99998 1.7778 4 0 6-1.3738 6-1.7778V11"/>
                          </svg>                          
                    </span>
                </div>

                <!-- Year and Section -->
                <div class="relative">
                    <label for="year_section" class="block text-sm font-medium text-gray-700">Year and Section <span> (e.g. 3A) </span></label>
                    <input type="text" id="year_section" name="year_section" required
                        class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <span class="absolute left-3 top-7 text-blue-600">
                        <svg class="w-[27px] h-[27px] text-blue-600 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.5713 5h7v9h-7m-6.00001-4-3 4.5m3-4.5v5m0-5h3.00001m0 0h5m-5 0v5m-3.00001 0h3.00001m-3.00001 0v5m3.00001-5v5m6-6 2.5 6m-3-6-2.5 6m-3-14.5c0 .82843-.67158 1.5-1.50001 1.5-.82843 0-1.5-.67157-1.5-1.5s.67157-1.5 1.5-1.5 1.50001.67157 1.50001 1.5Z"/>
                          </svg>                          
                    </span>
                </div>
                
                <!-- Semester -->
                <div class="relative">
                    <label for="semester" class="block text-sm font-medium text-gray-700">Semester <span> (required) </span></label>
                    <select id="semester" name="semester" required
                            class="w-full p-2 pl-10 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="" disabled selected>-Select Option-</option>
                        <option value="1st Semester">1st Semester</option>
                        <option value="2nd Semester">2nd Semester</option>
                    </select>
                    <span class="absolute left-3 top-7 text-blue-700">
                        <svg class="w-[27px] h-[27px] text-blue-600 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Zm3-7h.01v.01H8V13Zm4 0h.01v.01H12V13Zm4 0h.01v.01H16V13Zm-8 4h.01v.01H8V17Zm4 0h.01v.01H12V17Zm4 0h.01v.01H16V17Z"/>
                          </svg>                          
                    </span>
                </div>
                <!-- ...existing code... -->
                <!-- Submit Button -->
                <button type="submit"
                        class="w-full bg-blue-700 text-white py-4 px-4 rounded-2xl hover:bg-blue-800 transition duration-300">
                    Register
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
