

{% extends 'Student/student-base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center p-4">
    <div class="bg-white shadow-xl rounded-3xl overflow-hidden w-full max-w-7xl flex flex-col md:flex-row"> <!-- Increased max-width -->
        <!-- Left Column: Image -->
        <div class="hidden md:block md:w-5/12 bg-gradient-to-br from-blue-600 to-blue-800"> <!-- Changed flex to block and adjusted width -->
            <img src="{% static 'assets/img/login-bg.png' %}" alt="Student Login" 
                class="w-full h-full object-cover"> <!-- Removed padding and adjusted image to full height -->
        </div>

        <!-- Right Column: Registration Form -->
        <div class="w-full md:w-7/12 p-8 md:p-12"> <!-- Increased width ratio -->
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Student Registration</h2>
            <form action="{% url 'student_register' %}" method="POST" class="space-y-6" id="registrationForm">
                {% csrf_token %}
                
                <!-- Student ID (Full Width) -->
                <div class="relative">
                    <label for="student_id" class="block text-sm font-medium text-gray-700 mb-2">Student ID <span class="text-red-500">*</span></label>
                    <div class="relative flex items-center"> <!-- Added flex and items-center -->
                        <span class="absolute left-3 text-blue-600 z-10">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9h3m-3 3h3m-3 3h3m-6 1c-.306-.613-.933-1-1.618-1H7.618c-.685 0-1.312.387-1.618 1M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/>
                            </svg>
                        </span>
                        <input type="text" id="student_id" name="student_id" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Enter your student ID">
                    </div>
                </div>

                <!-- Two Column Layout with Wider Spacing -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8"> <!-- Increased gap -->
                    <!-- First Name -->
                    <div class="relative flex flex-col"> <!-- Added flex-col -->
                        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">First Name <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center"> <!-- Added container for input and icon alignment -->
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="first_name" name="first_name" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Enter your first name">
                        </div>
                    </div>

                    <!-- Last Name -->
                    <div class="relative flex flex-col"> <!-- Added flex-col -->
                        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">Last Name <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center"> <!-- Added container for input and icon alignment -->
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="last_name" name="last_name" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Enter your last name">
                        </div>
                    </div>

                    <!-- Program -->
                    <div class="relative flex flex-col">
                        <label for="program" class="block text-sm font-medium text-gray-700 mb-2">Program <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center"> <!-- Added container div for better alignment -->
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-600 z-10 pointer-events-none">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                </svg>
                            </span>
                            <select id="program" name="program" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none">
                                <option value="" disabled selected>Select your program</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                            </select>
                            <!-- Add dropdown indicator -->
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </span>
                        </div>
                    </div>

                    <!-- Middle Initial (Example of updated field) -->
                    <div class="relative flex flex-col">
                        <label for="middle_initial" class="block text-sm font-medium text-gray-700 mb-2">Middle Initial <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="middle_initial" name="middle_initial" required maxlength="1" 
                                class="w-full pl-10 pr-8 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
                                placeholder="M"
                                oninput="this.value = this.value.toUpperCase(); if(this.value) this.value = this.value[0];">
                            <span class="absolute right-4 text-gray-400">.</span>
                        </div>
                    </div>

                    <!-- Year and Section -->
                    <div class="relative flex flex-col">
                        <label for="year_section" class="block text-sm font-medium text-gray-700 mb-2">Year and Section <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center"> <!-- Added container div -->
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-600 z-10"> <!-- Fixed positioning -->
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                </svg>
                            </span>
                            <input type="text" id="year_section" name="year_section" required maxlength="2"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase"
                                placeholder="3A"
                                pattern="[1-4][A-Z]"
                                title="Please enter a number (1-4) followed by a capital letter (A-Z)"
                                oninput="this.value = this.value.toUpperCase();">
                        </div>
                    </div>
                    
                    <!-- Semester -->
                    <div class="relative flex flex-col">
                        <label for="semester" class="block text-sm font-medium text-gray-700 mb-2">Semester <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center"> <!-- Added container div -->
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-600 z-10"> <!-- Fixed positioning -->
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </span>
                            <select id="semester" name="semester" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none">
                                <option value="" disabled selected>Select semester</option>
                                <option value="1st Semester">1st Semester</option>
                                <option value="2nd Semester">2nd Semester</option>
                            </select>
                            <!-- Add dropdown indicator -->
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>


                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 px-6 rounded-xl hover:from-blue-700 hover:to-blue-800 transition duration-300 shadow-lg mt-8 font-medium text-lg">
                    Register
                </button>
            </form>
        </div>
    </div>
</div>

<script>
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    const yearSection = document.getElementById('year_section').value;
    const pattern = /^[1-4][A-Z]$/;
    
    if (!pattern.test(yearSection)) {
        e.preventDefault();
        alert('Year and Section must be a number (1-4) followed by a capital letter (A-Z)');
    }
});

// Auto-append dot to middle initial
document.getElementById('middle_initial').addEventListener('blur', function() {
    if (this.value && !this.value.endsWith('.')) {
        this.value = this.value + '.';
    }
});
</script>
{% endblock content %}
