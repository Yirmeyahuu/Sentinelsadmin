{% extends 'Student/student-base.html' %}
{% load static %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center p-4">
    <div class="bg-white shadow-xl rounded-3xl overflow-hidden w-full max-w-7xl flex flex-col md:flex-row">
        <!-- Left Column: Image -->
        <div class="hidden md:block md:w-5/12 bg-gradient-to-br from-blue-600 to-blue-800">
            <img src="{% static 'assets/img/login-bg.png' %}" alt="Student Login" 
                class="w-full h-full object-cover">
        </div>

        <!-- Right Column: Registration Form -->
        <div class="w-full md:w-7/12 p-8 md:p-12">
            <h2 class="text-3xl font-bold text-gray-800 mb-8">Student Registration</h2>
            <form action="{% url 'student_register' %}" method="POST" class="space-y-6" id="registrationForm">
                {% csrf_token %}
                
                <!-- Student ID (Full Width Row) -->
                <div class="w-full">
                    <div class="relative">
                        <label for="student_id" class="block text-sm font-medium text-gray-700 mb-2">Student ID <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9h3m-3 3h3m-3 3h3m-6 1c-.306-.613-.933-1-1.618-1H7.618c-.685 0-1.312.387-1.618 1M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/>
                                </svg>
                            </span>
                            <input type="text" id="student_id" name="student_id" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Enter your student ID"
                                onblur="checkStudentIdAvailability(this.value)">
                        </div>
                        <!-- Message container for student ID validation -->
                        <div id="student-id-message" class="text-sm mt-1 hidden"></div>
                    </div>
                </div>

                <!-- Name Fields Row (First Name, Middle Initial, Last Name) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4">
                    <!-- First Name (takes more space) -->
                    <div class="col-span-1 sm:col-span-1 lg:col-span-5">
                        <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">First Name <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="first_name" name="first_name" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Enter your first name"
                                oninput="formatName(this)">
                        </div>
                    </div>

                    <!-- Middle Initial (smaller space) -->
                    <div class="col-span-1 sm:col-span-1 lg:col-span-2">
                        <label for="middle_initial" class="block text-sm font-medium text-gray-700 mb-2">M.I. <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="middle_initial" name="middle_initial" required maxlength="2" 
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase text-center"
                                placeholder="M."
                                oninput="formatMiddleInitial(this)">
                        </div>
                    </div>

                    <!-- Last Name (takes more space) -->
                    <div class="col-span-1 sm:col-span-2 lg:col-span-5">
                        <label for="last_name" class="block text-sm font-medium text-gray-700 mb-2">Last Name <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </span>
                            <input type="text" id="last_name" name="last_name" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                placeholder="Enter your last name"
                                oninput="formatName(this)">
                        </div>
                    </div>
                </div>

                <!-- Program Details Row (Program, Year & Section, Semester) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Program -->
                    <div class="relative flex flex-col">
                        <label for="program" class="block text-sm font-medium text-gray-700 mb-2">Program <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-600 z-10 pointer-events-none">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                </svg>
                            </span>
                            <select id="program" name="program" required
                                class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none">
                                <option value="" disabled selected>Select program</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                            </select>
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </span>
                        </div>
                    </div>

                    <!-- Year and Section -->
                    <div class="relative flex flex-col">
                        <label for="year_section" class="block text-sm font-medium text-gray-700 mb-2">Year & Section <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                </svg>
                            </span>
                            <input type="text" id="year_section" name="year_section" required maxlength="2"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase text-center"
                                placeholder="3A"
                                oninput="formatYearSection(this)">
                        </div>
                    </div>
                    
                    <!-- Semester -->
                    <div class="relative flex flex-col">
                        <label for="semester" class="block text-sm font-medium text-gray-700 mb-2">Semester <span class="text-red-500">*</span></label>
                        <div class="relative flex items-center">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-blue-600 z-10">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </span>
                            <select id="semester" name="semester" required
                                class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none">
                                <option value="" disabled selected>Select semester</option>
                                <option value="1st Semester">1st Semester</option>
                                <option value="2nd Semester">2nd Semester</option>
                            </select>
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 text-white py-4 px-6 rounded-xl hover:from-blue-700 hover:to-blue-800 transition duration-300 shadow-lg mt-8 font-medium text-lg">
                    Register
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Format names to proper case (first letter capital, rest lowercase)
function formatName(input) {
    let value = input.value;
    // Remove any non-letter characters and convert to proper case
    value = value.replace(/[^a-zA-Z\s]/g, '');
    value = value.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
    input.value = value;
}

// Format middle initial (single letter + period)
function formatMiddleInitial(input) {
    let value = input.value.toUpperCase();
    // Remove any non-letter characters except period
    value = value.replace(/[^A-Z.]/g, '');
    
    // If there's a letter, ensure it has a period
    if (value.length > 0 && value.match(/[A-Z]/)) {
        // Get only the first letter and add period
        value = value.charAt(0) + '.';
    }
    
    input.value = value;
}

// Format year and section (1 digit + 1 letter)
function formatYearSection(input) {
    let value = input.value.toUpperCase();
    // Remove any characters that are not digits or letters
    value = value.replace(/[^0-9A-Z]/g, '');
    
    // Ensure format: first character is a digit (1-4), second is a letter
    if (value.length > 0) {
        let formatted = '';
        
        // First character should be a digit 1-4
        if (value.charAt(0).match(/[1-4]/)) {
            formatted += value.charAt(0);
        }
        
        // Second character should be a letter
        if (value.length > 1 && value.charAt(1).match(/[A-Z]/)) {
            formatted += value.charAt(1);
        }
        
        value = formatted;
    }
    
    input.value = value;
}

// Form validation on submit
document.getElementById('registrationForm').addEventListener('submit', function(e) {
    const firstName = document.getElementById('first_name').value.trim();
    const lastName = document.getElementById('last_name').value.trim();
    const middleInitial = document.getElementById('middle_initial').value.trim();
    const yearSection = document.getElementById('year_section').value.trim();
    
    let errors = [];
    
    // Validate first name and last name (should contain only letters and spaces)
    if (!firstName.match(/^[A-Za-z\s]+$/)) {
        errors.push('First name should contain only letters and spaces.');
    }
    
    if (!lastName.match(/^[A-Za-z\s]+$/)) {
        errors.push('Last name should contain only letters and spaces.');
    }
    
    // Validate middle initial (should be exactly one letter followed by a period)
    if (!middleInitial.match(/^[A-Z]\.$/)) {
        errors.push('Middle initial should be a single letter followed by a period (e.g., "M.").');
    }
    
    // Validate year and section (should be exactly one digit 1-4 followed by one letter)
    if (!yearSection.match(/^[1-4][A-Z]$/)) {
        errors.push('Year and Section should be a number (1-4) followed by a capital letter (e.g., "3A").');
    }
    
    if (errors.length > 0) {
        e.preventDefault();
        alert('Please fix the following errors:\n\n' + errors.join('\n'));
    }
});



async function checkStudentIdAvailability(studentId) {
    if (!studentId || studentId.length < 3) return; // Don't check if too short
    
    try {
        const response = await fetch('/Student/check-student-id/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({student_id: studentId})
        });
        
        const data = await response.json();
        const inputField = document.getElementById('student_id');
        const messageDiv = document.getElementById('student-id-message') || createMessageDiv();
        
        if (data.exists) {
            inputField.classList.add('border-red-500', 'focus:ring-red-500');
            inputField.classList.remove('border-gray-300', 'focus:ring-blue-500');
            messageDiv.className = 'text-red-500 text-sm mt-1';
            messageDiv.textContent = 'This Student ID is already taken.';
        } else {
            inputField.classList.add('border-green-500', 'focus:ring-green-500');
            inputField.classList.remove('border-red-500', 'focus:ring-red-500', 'border-gray-300');
            messageDiv.className = 'text-green-500 text-sm mt-1';
            messageDiv.textContent = 'Student ID is available.';
        }
    } catch (error) {
        console.error('Error checking student ID:', error);
    }
}

function createMessageDiv() {
    const messageDiv = document.getElementById('student-id-message');
    messageDiv.classList.remove('hidden'); // Show the div
    return messageDiv;
}
</script>
{% endblock content %}
