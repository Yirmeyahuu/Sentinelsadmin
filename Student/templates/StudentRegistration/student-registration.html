{% extends 'Student/student-base.html' %}
{% load static %}

{% block title %}Student Registration{% endblock title %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center p-4">
    <div class="bg-white shadow-xl rounded-3xl overflow-hidden w-full max-w-6xl flex flex-col md:flex-row min-h-[400px]">
        <!-- Left Column: Image -->
        <div class="hidden md:block md:w-5/12 bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 relative overflow-hidden">
            <div class="absolute inset-0 bg-black/10"></div>
            <img src="{% static 'assets/img/login-bg.png' %}" alt="Student Login" 
                class="w-full h-full object-cover opacity-90">
            <!-- Decorative elements -->
            <div class="absolute top-0 left-0 w-full h-full">
                <div class="absolute top-10 left-10 w-20 h-20 bg-white/10 rounded-full blur-xl"></div>
                <div class="absolute bottom-10 right-10 w-32 h-32 bg-white/10 rounded-full blur-2xl"></div>
            </div>
        </div>

        <!-- Right Column: Registration Form -->
        <div class="w-full md:w-7/12 p-6 md:p-6 lg:p-8 overflow-y-auto max-h-[90vh] md:max-h-full">
            <!-- Header -->
            <div class="mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-2">Create Account</h2>
                <p class="text-sm text-gray-500">Fill in your details to get started</p>
            </div>

            <form action="{% url 'student_register' %}" method="POST" class="space-y-5" id="registrationForm">
                {% csrf_token %}
                
                <!-- Student ID -->
                <div class="w-full">
                    <label for="student_id" class="block text-sm font-semibold text-gray-700 mb-2">
                        Student ID <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 9h3m-3 3h3m-3 3h3m-6 1c-.306-.613-.933-1-1.618-1H7.618c-.685 0-1.312.387-1.618 1M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm7 5a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/>
                            </svg>
                        </div>
                        <input type="text" id="student_id" name="student_id" required
                            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm"
                            placeholder="Enter your student ID"
                            onblur="checkStudentIdAvailability(this.value)">
                    </div>
                    <!-- Fixed height message container -->
                    <div class="h-5 mt-1">
                        <div id="student-id-message" class="text-xs transition-opacity duration-200 hidden"></div>
                    </div>
                </div>

                <!-- Name Fields -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-12 gap-4">
                    <!-- First Name -->
                    <div class="col-span-1 sm:col-span-1 lg:col-span-5">
                        <label for="first_name" class="block text-sm font-semibold text-gray-700 mb-2">
                            First Name <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                            <input type="text" id="first_name" name="first_name" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm"
                                placeholder="First name"
                                oninput="formatName(this)">
                        </div>
                    </div>

                    <!-- Middle Initial -->
                    <div class="col-span-1 sm:col-span-1 lg:col-span-2">
                        <label for="middle_initial" class="block text-sm font-semibold text-gray-700 mb-2">
                            M.I. <span class="text-gray-400 text-xs font-light">(Optional)</span>
                        </label>
                        <div class="relative">
                            <input type="text" id="middle_initial" name="middle_initial" maxlength="2" 
                                class="w-full px-3 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase text-center transition-all duration-200 text-sm font-semibold"
                                placeholder="M."
                                oninput="formatMiddleInitial(this)">
                        </div>
                    </div>

                    <!-- Last Name -->
                    <div class="col-span-1 sm:col-span-2 lg:col-span-5">
                        <label for="last_name" class="block text-sm font-semibold text-gray-700 mb-2">
                            Last Name <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                            </div>
                            <input type="text" id="last_name" name="last_name" required
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm"
                                placeholder="Last name"
                                oninput="formatName(this)">
                        </div>
                    </div>
                </div>

                <!-- Program Details -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Program -->
                    <div class="relative flex flex-col">
                        <label for="program" class="block text-sm font-semibold text-gray-700 mb-2">
                            Program <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                </svg>
                            </div>
                            <select id="program" name="program" required
                                class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none transition-all duration-200 text-sm bg-white">
                                <option value="" disabled selected>Select program</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Year and Section -->
                    <div class="relative flex flex-col">
                        <label for="year_section" class="block text-sm font-semibold text-gray-700 mb-2">
                            Year & Section <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                                </svg>
                            </div>
                            <input type="text" id="year_section" name="year_section" required maxlength="2"
                                class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent uppercase text-center transition-all duration-200 text-sm font-semibold"
                                placeholder="3A"
                                oninput="formatYearSection(this)">
                        </div>
                        <div class="h-5 mt-1">
                            <div id="year-section-message" class="text-xs transition-opacity duration-200 hidden"></div>
                        </div>
                    </div>
                    
                    <!-- Semester -->
                    <div class="relative flex flex-col">
                        <label for="semester" class="block text-sm font-semibold text-gray-700 mb-2">
                            Semester <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <select id="semester" name="semester" required
                                class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent appearance-none transition-all duration-200 text-sm bg-white">
                                <option value="" disabled selected>Select semester</option>
                                <option value="1st Semester">1st Semester</option>
                                <option value="2nd Semester">2nd Semester</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                                </svg>
                            </div>
                        </div>
                        <div class="h-5 mt-1">
                            <div id="semester-message" class="text-xs transition-opacity duration-200 hidden"></div>
                        </div>
                    </div>
                </div>

                <!-- Password Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Password -->
                    <div class="relative flex flex-col">
                        <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">
                            Password <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <input type="password" id="password" name="password" required minlength="8"
                                class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm"
                                placeholder="Min. 8 characters"
                                oninput="checkPasswordMatch()">
                            <button type="button" onclick="togglePassword('password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="password-eye">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                        <div class="h-5 mt-1">
                            <div id="password-message" class="text-xs transition-opacity duration-200 hidden"></div>
                        </div>
                    </div>
                
                    <!-- Confirm Password -->
                    <div class="relative flex flex-col">
                        <label for="confirm_password" class="block text-sm font-semibold text-gray-700 mb-2">
                            Confirm Password <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                </svg>
                            </div>
                            <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                                class="w-full pl-10 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 text-sm"
                                placeholder="Re-enter password"
                                oninput="checkPasswordMatch()">
                            <button type="button" onclick="togglePassword('confirm_password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="confirm-password-eye">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                </svg>
                            </button>
                        </div>
                        <div class="h-5 mt-1">
                            <div id="confirm-password-message" class="text-xs transition-opacity duration-200 hidden"></div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-3.5 px-6 rounded-lg hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all duration-300 shadow-lg hover:shadow-xl font-semibold text-sm mt-6 transform hover:-translate-y-0.5 cursor-pointer">
                    Create Account
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Format names to proper case (first letter capital, rest lowercase)
function formatName(input) {
    let value = input.value;
    // Remove any non-letter characters and convert to proper case
    value = value.replace(/[^a-zA-Z\s]/g, '');
    value = value.toLowerCase().replace(/\b\w/g, l => l.toUpperCase());
    input.value = value;
}

// Format middle initial (single letter + period)
function formatMiddleInitial(input) {
    let value = input.value.toUpperCase();
    // Remove any non-letter characters except period
    value = value.replace(/[^A-Z.]/g, '');
    
    // If there's a letter, ensure it has a period
    if (value.length > 0 && value.match(/[A-Z]/)) {
        // Get only the first letter and add period
        value = value.charAt(0) + '.';
    }
    
    input.value = value;
}

// Format year and section (1 digit + 1 letter)
function formatYearSection(input) {
    let value = input.value.toUpperCase();
    // Remove any characters that are not digits or letters
    value = value.replace(/[^0-9A-Z]/g, '');
    
    // Ensure format: first character is a digit (1-4), second is a letter
    if (value.length > 0) {
        let formatted = '';
        
        // First character should be a digit 1-4
        if (value.charAt(0).match(/[1-4]/)) {
            formatted += value.charAt(0);
        }
        
        // Second character should be a letter
        if (value.length > 1 && value.charAt(1).match(/[A-Z]/)) {
            formatted += value.charAt(1);
        }
        
        value = formatted;
    }
    
    input.value = value;
}

// Form validation on submit
document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault(); // Always prevent default first
    
    const firstName = document.getElementById('first_name').value.trim();
    const lastName = document.getElementById('last_name').value.trim();
    const middleInitial = document.getElementById('middle_initial').value.trim();
    const yearSection = document.getElementById('year_section').value.trim();
    const program = document.getElementById('program').value;
    const semester = document.getElementById('semester').value;
    
    let errors = [];
    
    // MANDATORY faculty assignment validation first
    if (program && yearSection && semester) {
        try {
            const response = await fetch('/Student/check-faculty-assignment/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({
                    program: program,
                    year_section: yearSection,
                    semester: semester
                })
            });
            
            const data = await response.json();
            if (!data.faculty_exists) {
                errors.push('❌ Cannot register: No Faculty assigned to this program, year section, and semester. Please contact your instructor first.');
                
                // Also update UI to show error
                const yearSectionField = document.getElementById('year_section');
                const semesterField = document.getElementById('semester');
                yearSectionField.classList.add('border-red-500', 'focus:ring-red-500');
                semesterField.classList.add('border-red-500', 'focus:ring-red-500');
            }
        } catch (error) {
            console.error('Error validating faculty assignment:', error);
            errors.push('❌ Unable to validate faculty assignment. Please check your internet connection and try again.');
        }
    } else {
        errors.push('❌ Please select Program, Year & Section, and Semester before submitting.');
    }
    
    // Other existing validations
    if (!firstName.match(/^[A-Za-z\s]+$/)) {
        errors.push('First name should contain only letters and spaces.');
    }
    
    if (!lastName.match(/^[A-Za-z\s]+$/)) {
        errors.push('Last name should contain only letters and spaces.');
    }
    
    if (!middleInitial.match(/^[A-Z]\.$/)) {
        errors.push('Middle initial should be a single letter followed by a period (e.g., "M.").');
    }
    
    if (!yearSection.match(/^[1-4][A-Z]$/)) {
        errors.push('Year and Section should be a number (1-4) followed by a capital letter (e.g., "3A").');
    }
    
    // Only submit if no errors
    if (errors.length > 0) {
        alert('⚠️ Registration cannot proceed:\n\n' + errors.join('\n\n'));
        return false;
    }
    
    // If all validations pass, submit the form
    this.submit();
});



async function checkStudentIdAvailability(studentId) {
    if (!studentId || studentId.length < 3) return; // Don't check if too short
    
    try {
        const response = await fetch('/Student/check-student-id/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({student_id: studentId})
        });
        
        const data = await response.json();
        const inputField = document.getElementById('student_id');
        const messageDiv = document.getElementById('student-id-message') || createMessageDiv();
        
        if (data.exists) {
            inputField.classList.add('border-red-500', 'focus:ring-red-500');
            inputField.classList.remove('border-gray-300', 'focus:ring-blue-500');
            messageDiv.className = 'text-red-500 text-sm mt-1';
            messageDiv.textContent = 'This Student ID is already taken.';
        } else {
            inputField.classList.add('border-green-500', 'focus:ring-green-500');
            inputField.classList.remove('border-red-500', 'focus:ring-red-500', 'border-gray-300');
            messageDiv.className = 'text-green-500 text-sm mt-1';
            messageDiv.textContent = 'Student ID is available.';
        }
    } catch (error) {
        console.error('Error checking student ID:', error);
    }
}

function createMessageDiv() {
    const messageDiv = document.getElementById('student-id-message');
    messageDiv.classList.remove('hidden'); // Show the div
    return messageDiv;
}


async function validateFacultyAssignment() {
    const program = document.getElementById('program').value;
    const yearSection = document.getElementById('year_section').value;
    const semester = document.getElementById('semester').value;
    
    if (!program || !yearSection || !semester) {
        // Clear messages and styling when fields are incomplete
        clearFacultyValidationMessages();
        return;
    }
    
    try {
        const response = await fetch('/Student/check-faculty-assignment/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
            },
            body: JSON.stringify({
                program: program,
                year_section: yearSection,
                semester: semester
            })
        });
        
        const data = await response.json();
        const yearSectionField = document.getElementById('year_section');
        const semesterField = document.getElementById('semester');
        const yearSectionMessage = document.getElementById('year-section-message');
        const semesterMessage = document.getElementById('semester-message');
        
        if (!data.faculty_exists) {
            // Add error styling
            yearSectionField.classList.add('border-red-500', 'focus:ring-red-500');
            yearSectionField.classList.remove('border-gray-300', 'focus:ring-blue-500');
            semesterField.classList.add('border-red-500', 'focus:ring-red-500');
            semesterField.classList.remove('border-gray-300', 'focus:ring-blue-500');
            
            // Show error messages
            yearSectionMessage.className = 'text-red-500 text-sm mt-1';
            yearSectionMessage.textContent = 'No Faculty registered for this combination.';
            yearSectionMessage.classList.remove('hidden');
            
            semesterMessage.className = 'text-red-500 text-sm mt-1';
            semesterMessage.textContent = 'Please contact your instructor.';
            semesterMessage.classList.remove('hidden');
        } else {
            // Remove error styling and show success
            yearSectionField.classList.remove('border-red-500', 'focus:ring-red-500');
            yearSectionField.classList.add('border-green-500', 'focus:ring-green-500');
            semesterField.classList.remove('border-red-500', 'focus:ring-red-500');
            semesterField.classList.add('border-green-500', 'focus:ring-green-500');
            
            // Show success messages
            yearSectionMessage.className = 'text-green-500 text-sm mt-1';
            yearSectionMessage.textContent = 'Faculty available for this section.';
            yearSectionMessage.classList.remove('hidden');
            
            semesterMessage.className = 'text-green-500 text-sm mt-1';
            semesterMessage.textContent = 'Valid semester selection.';
            semesterMessage.classList.remove('hidden');
        }
    } catch (error) {
        console.error('Error checking faculty assignment:', error);
        clearFacultyValidationMessages();
    }
}

// Helper function to clear validation messages
function clearFacultyValidationMessages() {
    const yearSectionField = document.getElementById('year_section');
    const semesterField = document.getElementById('semester');
    const yearSectionMessage = document.getElementById('year-section-message');
    const semesterMessage = document.getElementById('semester-message');
    
    // Reset field styling
    yearSectionField.classList.remove('border-red-500', 'focus:ring-red-500', 'border-green-500', 'focus:ring-green-500');
    yearSectionField.classList.add('border-gray-300', 'focus:ring-blue-500');
    semesterField.classList.remove('border-red-500', 'focus:ring-red-500', 'border-green-500', 'focus:ring-green-500');
    semesterField.classList.add('border-gray-300', 'focus:ring-blue-500');
    
    // Hide messages
    yearSectionMessage.classList.add('hidden');
    semesterMessage.classList.add('hidden');
}

document.getElementById('program').addEventListener('change', validateFacultyAssignment);
document.getElementById('year_section').addEventListener('input', validateFacultyAssignment);
document.getElementById('semester').addEventListener('change', validateFacultyAssignment);
</script>


<script>
function togglePassword(fieldId) {
    const field = document.getElementById(fieldId);
    const type = field.getAttribute('type') === 'password' ? 'text' : 'password';
    field.setAttribute('type', type);
}

function checkPasswordMatch() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const passwordField = document.getElementById('password');
    const confirmField = document.getElementById('confirm_password');
    const passwordMessage = document.getElementById('password-message');
    const confirmMessage = document.getElementById('confirm-password-message');
    
    // Password strength validation
    if (password.length > 0) {
        if (password.length < 8) {
            passwordField.classList.add('border-red-500', 'focus:ring-red-500');
            passwordField.classList.remove('border-green-500', 'focus:ring-green-500');
            passwordMessage.className = 'text-red-500 text-sm mt-1';
            passwordMessage.textContent = 'Password must be at least 8 characters.';
            passwordMessage.classList.remove('hidden');
        } else {
            passwordField.classList.add('border-green-500', 'focus:ring-green-500');
            passwordField.classList.remove('border-red-500', 'focus:ring-red-500');
            passwordMessage.className = 'text-green-500 text-sm mt-1';
            passwordMessage.textContent = 'Password strength: Good';
            passwordMessage.classList.remove('hidden');
        }
    } else {
        passwordField.classList.remove('border-red-500', 'border-green-500');
        passwordMessage.classList.add('hidden');
    }
    
    // Confirm password match validation
    if (confirmPassword.length > 0) {
        if (password !== confirmPassword) {
            confirmField.classList.add('border-red-500', 'focus:ring-red-500');
            confirmField.classList.remove('border-green-500', 'focus:ring-green-500');
            confirmMessage.className = 'text-red-500 text-sm mt-1';
            confirmMessage.textContent = 'Passwords do not match.';
            confirmMessage.classList.remove('hidden');
        } else if (password === confirmPassword && password.length >= 8) {
            confirmField.classList.add('border-green-500', 'focus:ring-green-500');
            confirmField.classList.remove('border-red-500', 'focus:ring-red-500');
            confirmMessage.className = 'text-green-500 text-sm mt-1';
            confirmMessage.textContent = 'Passwords match!';
            confirmMessage.classList.remove('hidden');
        }
    } else {
        confirmField.classList.remove('border-red-500', 'border-green-500');
        confirmMessage.classList.add('hidden');
    }
}

// Update the form validation to include password checks
document.getElementById('registrationForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    
    let errors = [];
    
    // Password validation
    if (password.length < 8) {
        errors.push('Password must be at least 8 characters long.');
    }
    
    if (password !== confirmPassword) {
        errors.push('Passwords do not match.');
    }
    
    // Only submit if no errors
    if (errors.length > 0) {
        alert('⚠️ Registration cannot proceed:\n\n' + errors.join('\n\n'));
        return false;
    }
    
    this.submit();
});
</script>
