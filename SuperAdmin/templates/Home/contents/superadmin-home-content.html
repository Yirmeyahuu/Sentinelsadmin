{% load static %}
<script>
    document.title = "SENTINELS | Home";
</script>

<!-- Main Container -->
<div class="flex flex-col min-h-screen ml-20">
    <!-- Dashboard Cards Container -->
    <div class="px-6 mb-8">
        <div class="max-w-[calc(100%-80px)] mx-auto">
                <!-- Dashboard Cards Row -->
                <div class="flex space-x-6 w-full">
                    <!-- Total Students Card -->
                    <div class="flex-1 min-w-[260px] relative group bg-gradient-to-br from-blue-500 to-blue-700 shadow-xl rounded-2xl p-6 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <!-- Decorative Blur Effect -->
                        <div class="absolute top-0 right-0 w-32 h-32 transform translate-x-16 -translate-y-16">
                            <div class="absolute inset-0 bg-blue-400 opacity-50 blur-3xl rounded-full"></div>
                        </div>
                        <!-- Card Content -->
                        <div class="flex items-center justify-between relative z-10">
                            <div>
                                <p class="text-blue-100 text-sm font-medium mb-1">Total Students</p>
                                <h3 class="text-4xl font-bold text-white">{{ total_students }}</h3>
                            </div>
                            <div class="bg-blue-400/30 p-3 rounded-xl">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                </svg>
                                
                            </div>
                        </div>
                    </div>
                
                    <!-- Total Faculty Card -->
                    <div class="flex-1 min-w-[260px] relative group bg-gradient-to-br from-indigo-500 to-indigo-700 shadow-xl rounded-2xl p-6 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <div class="absolute top-0 right-0 w-32 h-32 transform translate-x-16 -translate-y-16">
                            <div class="absolute inset-0 bg-indigo-400 opacity-50 blur-3xl rounded-full"></div>
                        </div>
                        <div class="flex items-center justify-between relative z-10">
                            <div>
                                <p class="text-indigo-100 text-sm font-medium mb-1">Total Faculty</p>
                                <h3 class="text-4xl font-bold text-white">{{ total_faculty }}</h3>
                            </div>
                            <div class="bg-indigo-400/30 p-3 rounded-xl">
                                <svg class="w-8 h-8 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.7141 15h4.268c.4043 0 .732-.3838.732-.8571V3.85714c0-.47338-.3277-.85714-.732-.85714H6.71411c-.55228 0-1 .44772-1 1v4m10.99999 7v-3h3v3h-3Zm-3 6H6.71411c-.55228 0-1-.4477-1-1 0-1.6569 1.34315-3 3-3h2.99999c1.6569 0 3 1.3431 3 3 0 .5523-.4477 1-1 1Zm-1-9.5c0 1.3807-1.1193 2.5-2.5 2.5s-2.49999-1.1193-2.49999-2.5S8.8334 9 10.2141 9s2.5 1.1193 2.5 2.5Z"/>
                                </svg>

                            </div>
                        </div>
                    </div>
                
                    <!-- CS Students Card -->
                    <div class="flex-1 min-w-[260px] relative group bg-gradient-to-br from-amber-500 to-amber-700 shadow-xl rounded-2xl p-6 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <div class="absolute top-0 right-0 w-32 h-32 transform translate-x-16 -translate-y-16">
                            <div class="absolute inset-0 bg-amber-400 opacity-50 blur-3xl rounded-full"></div>
                        </div>
                        <div class="flex items-center justify-between relative z-10">
                            <div>
                                <p class="text-amber-100 text-sm font-medium mb-1">CS Students</p>
                                <h3 class="text-4xl font-bold text-white">{{ cs_students }}</h3>
                            </div>
                            <div class="bg-amber-400/30 p-3 rounded-xl">
                                <svg class="w-8 h-8 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.35709 16V5.78571c0-.43393.34822-.78571.77777-.78571H18.5793c.4296 0 .7778.35178.7778.78571V16M5.35709 16h-1c-.55229 0-1 .4477-1 1v1c0 .5523.44771 1 1 1H20.3571c.5523 0 1-.4477 1-1v-1c0-.5523-.4477-1-1-1h-1M5.35709 16H19.3571M9.35709 8l2.62501 2.5L9.35709 13m4.00001 0h2"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                
                    <!-- IT Students Card -->
                    <div class="flex-1 min-w-[260px] relative group bg-gradient-to-br from-rose-500 to-rose-700 shadow-xl rounded-2xl p-6 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
                        <div class="absolute top-0 right-0 w-32 h-32 transform translate-x-16 -translate-y-16">
                            <div class="absolute inset-0 bg-rose-400 opacity-50 blur-3xl rounded-full"></div>
                        </div>
                        <div class="flex items-center justify-between relative z-10">
                            <div>
                                <p class="text-rose-100 text-sm font-medium mb-1">IT Students</p>
                                <h3 class="text-4xl font-bold text-white">{{ it_students }}</h3>
                            </div>
                            <div class="bg-rose-400/30 p-3 rounded-xl">
                                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Students by Tier & Program Line Chart -->
                <div class="bg-gradient-to-br from-blue-700/60 to-blue-600 rounded-2xl shadow-2xl p-8 w-full mt-6 border border-sky-700/30">
                    <div class="flex justify-between items-center mb-6">
                        <!-- Chart Title -->
                        <div>
                            <h3 class="text-xl font-bold text-white mb-1">Activity Progress</h3>
                            <p class="text-blue-100/70 text-sm"><span id="programLabel">All Programs</span></p>
                        </div>
                        
                        <!-- Program Selector Dropdown -->
                        <div class="relative">
                            <button id="programMenuBtn" 
                                    class="bg-blue-800/50 text-sm px-4 py-2.5 text-white rounded-xl shadow-lg 
                                           hover:bg-blue-700/50 focus:outline-none focus:ring-2 focus:ring-blue-400 
                                           focus:ring-offset-2 focus:ring-offset-blue-800 flex items-center space-x-2 
                                           transition-all duration-200 border border-blue-500/30">
                                <span id="programMenuBtnText">All Programs</span>
                                <svg class="w-4 h-4 ml-1 text-blue-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                            <div id="programMenu" 
                                 class="absolute right-0 mt-2 w-48 bg-blue-800/95 rounded-xl shadow-xl border 
                                        border-blue-500/30 hidden z-10 backdrop-blur-sm">
                                <button class="block w-full text-left px-4 py-2.5 text-blue-100 hover:bg-blue-700/50 
                                        hover:text-white transition-colors duration-200 first:rounded-t-xl" 
                                        onclick="changeProgram('All')">All Programs</button>
                                <button class="block w-full text-left px-4 py-2.5 text-blue-100 hover:bg-blue-700/50 
                                        hover:text-white transition-colors duration-200" 
                                        onclick="changeProgram('Computer Science')">Computer Science</button>
                                <button class="block w-full text-left px-4 py-2.5 text-blue-100 hover:bg-blue-700/50 
                                        hover:text-white transition-colors duration-200 last:rounded-b-xl" 
                                        onclick="changeProgram('Information Technology')">Information Technology</button>
                            </div>
                        </div>
                    </div>
                                        
                    <script>
                        // Pass Django data to JavaScript for chart rendering
                        window.csTierData = {{ cs_tier_data|safe }};
                        window.itTierData = {{ it_tier_data|safe }};
                        window.tierLabels = {{ tier_labels|safe }};
                        
                        console.log('Data set from template:', {
                            csTierData: window.csTierData,
                            itTierData: window.itTierData,
                            tierLabels: window.tierLabels
                        });
                    </script>
                    
                    <!-- Chart Canvas Container -->
                    <div class="mt-4 rounded-xl bg-blue-900/50 p-4 border border-sky-600/30">
                        <canvas id="programLineChart" height="80"></canvas>
                    </div>
                </div>
        </div>
    </div>
</div>
