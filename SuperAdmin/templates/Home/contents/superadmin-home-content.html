
<div class="p-0 pb-6 px-6 flex justify-center">
    <div class="w-full max-w-8xl flex space-x-6 mx-auto">
        <div class="flex-1 flex flex-col items-center">
            <div class="flex flex-col items-center w-[1200px]">
                <!-- Dashboard Cards Row -->
                <div class="flex space-x-6 w-full">
                    <!-- Total Students -->
                    <div class="relative bg-blue-600 shadow-xl rounded-tl-4xl rounded-br-4xl p-6 w-72 flex flex-col items-center overflow-hidden">
                        <div class="absolute inset-0 opacity-30">
                            <svg class="w-full h-full" viewBox="0 0 200 200">
                                <path fill="none" stroke="#1C82AD" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                                <path fill="none" stroke="#F3F3E0" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                            </svg>
                        </div>
                        <div class="absolute -top-4 -left-6 w-16 h-16 bg-sky-300 blur-2xl opacity-90 rounded-full"></div>
                        <div class="absolute bottom-0 right-2 w-20 h-20 bg-sky-300 blur-2xl opacity-90 rounded-full"></div>
                        <h2 class="text-xl font-semibold text-white mb-4 mt-2 z-10">Total Students</h2>
                        <p class="text-4xl font-bold text-white z-10">{{ total_students }}</p>
                    </div>
                    <!-- Total Faculty -->
                    <div class="relative bg-sky-500 shadow-xl rounded-tl-4xl rounded-br-4xl p-6 w-72 flex flex-col items-center overflow-hidden">
                        <div class="absolute inset-0 opacity-30">
                            <svg class="w-full h-full" viewBox="0 0 200 200">
                                <path fill="none" stroke="#D4F6FF" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                                <path fill="none" stroke="#C4E1F6" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                            </svg>
                        </div>
                        <div class="absolute -top-4 -left-6 w-16 h-16 bg-blue-900 blur-2xl opacity-90 rounded-full"></div>
                        <div class="absolute bottom-0 right-2 w-20 h-20 bg-blue-700 blur-2xl opacity-90 rounded-full"></div>
                        <h2 class="text-xl font-semibold text-white mb-4 mt-2 z-10">Total Faculty</h2>
                        <p class="text-4xl font-bold text-white z-10">{{ total_faculty }}</p>
                    </div>
                    <!-- Computer Science Students -->
                    <div class="relative bg-orange-500 shadow-xl rounded-tl-4xl rounded-br-4xl p-6 w-72 flex flex-col items-center overflow-hidden">
                        <div class="absolute inset-0 opacity-30">
                            <svg class="w-full h-full" viewBox="0 0 200 200">
                                <path fill="none" stroke="#F2F9FF" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                                <path fill="none" stroke="#A1E3F9" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                            </svg>
                        </div>
                        <div class="absolute -top-4 -left-6 w-16 h-16 bg-yellow-100 blur-2xl opacity-90 rounded-full"></div>
                        <div class="absolute bottom-0 right-2 w-20 h-20 bg-yellow-100 blur-2xl opacity-90 rounded-full"></div>
                        <h2 class="text-lg font-semibold text-center text-white z-10">Computer Science Students</h2>
                        <p class="text-4xl font-bold text-white z-10">{{ cs_students }}</p>
                    </div>
                    <!-- Information Technology Students -->
                    <div class="relative bg-red-600 shadow-xl rounded-tl-4xl rounded-br-4xl p-6 w-72 flex flex-col items-center overflow-hidden">
                        <div class="absolute inset-0 opacity-30">
                            <svg class="w-full h-full" viewBox="0 0 200 200">
                                <path fill="none" stroke="#F2F9FF" stroke-width="8" d="M10 50 Q100 0, 190 50 T 390 50" />
                                <path fill="none" stroke="#A1E3F9" stroke-width="8" d="M10 150 Q100 200, 190 150 T 390 150" />
                            </svg>
                        </div>
                        <div class="absolute -top-4 -left-6 w-16 h-16 bg-purple-700 blur-2xl opacity-90 rounded-full"></div>
                        <div class="absolute bottom-0 right-2 w-20 h-20 bg-purple-700 blur-2xl opacity-90 rounded-full"></div>
                        <h2 class="text-lg font-semibold text-center     text-white z-10">Information Technology Students</h2>
                        <p class="text-4xl font-bold text-white z-10">{{ it_students }}</p>
                    </div>
                </div>
                <!-- Add more cards as needed (e.g., per program, per year, etc.) -->

                 <!-- Students by Tier & Program Line Chart -->
                <div class="bg-sky-600 rounded-tl-4xl rounded-br-4xl shadow-xl p-6 w-full mt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-bold text-white">Activity Progress | <span id="programLabel">Programs</span></h3>
                        <div class="relative">
                            <button id="programMenuBtn" class="bg-sky-100 text-sm p-2 text-sky-900 rounded-lg shadow hover:bg-sky-200 focus:outline-none flex items-center space-x-2">
                                <span id="programMenuBtnText">All Programs</span>
                                <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                            <div id="programMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 hidden z-10">
                                <button class="block w-full text-left px-4 py-2 hover:bg-sky-100" onclick="changeProgram('All')">All Programs</button>
                                <button class="block w-full text-left px-4 py-2 hover:bg-sky-100" onclick="changeProgram('Computer Science')">Computer Science</button>
                                <button class="block w-full text-left px-4 py-2 hover:bg-sky-100" onclick="changeProgram('Information Technology')">Information Technology</button>
                            </div>
                        </div>
                    </div>
                    <canvas id="programLineChart" height="80"></canvas>
                </div>

                <!-- You can add tables or charts below, similar to faculty-home.html -->
                <!-- Example: Recent Students, Recent Faculty, Activity Progress, etc. -->
            </div>
        </div>
    </div>
</div>
