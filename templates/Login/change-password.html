{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Change Password</title>
    <link rel="icon" href="{% static 'assets/img/Sentinels New Logo.png' %}" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        font-family: "Poppins", sans-serif;
      }
    </style>
  </head>
  <body class="h-screen flex bg-gray-100">
    <!-- Left Section (Image) -->
    <div class="w-2/3 h-screen relative rounded-r-3xl overflow-hidden">
      <img
        src="{% static 'assets/img/login-bg.png' %}"
        alt="Background Image"
        class="w-full h-full object-cover"
      />
    </div>

    <!-- Right Section (Change Password Form) -->
    <div
      class="w-1/3 h-screen bg-gray-100 flex items-center justify-center rounded-l-3xl overflow-hidden"
    >
      <div
        class="bg-white pl-5 pr-5 rounded-3xl w-2/3 max-w-md shadow-2xl min-h-[450px] flex flex-col justify-center"
      >
        <div class="text-center">
          <img
            src="{% static 'assets/img/Sentinels New Logo.png' %}"
            alt="Sentinels Logo"
            class="mx-auto h-32 mt-8 mb-6"
          />
        </div>

        <h1 class="text-center text-blue-500 text-xl font-semibold mb-4">
          Change Your Password
        </h1>

        <!-- Display Messages -->
        {% if messages %} {% for message in messages %}
        <div
          class="mb-4 p-3 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}"
        >
          {{ message }}
        </div>
        {% endfor %} {% endif %}

        <form
          method="POST"
          action="{% url 'change_password' %}"
          class="space-y-6 mb-8"
        >
          {% csrf_token %}

          <!-- New Password Input -->
          <div class="relative">
            <label
              for="new_password"
              class="block text-blue-400 text-sm font-medium mb-2"
              >Enter New Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="New Password"
                required
                class="peer w-full pl-3 pr-12 py-2.5 text-gray-600 text-base border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-blue-400"
              />
              <button
                type="button"
                onclick="togglePassword('new_password')"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors duration-200"
              >
                <svg
                  id="new_password_eye"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password Input -->
          <div class="relative">
            <label
              for="confirm_password"
              class="block text-blue-400 text-sm font-medium mb-2"
              >Confirm Password</label
            >
            <div class="relative">
              <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm Password"
                required
                class="peer w-full pl-3 pr-12 py-2.5 text-gray-600 text-base border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-blue-400"
              />
              <button
                type="button"
                onclick="togglePassword('confirm_password')"
                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors duration-200"
              >
                <svg
                  id="confirm_password_eye"
                  xmlns="http://www.w3.org/2000/svg"
                  class="h-5 w-5"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                  />
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                  />
                </svg>
              </button>
            </div>
            <!-- Password match indicator -->
            <div id="match-message" class="text-xs mt-1 hidden"></div>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-700 hover:bg-blue-500 text-white text-lg font-medium py-3 rounded-2xl transition duration-200"
          >
            Update Password
          </button>
        </form>
      </div>
    </div>

    <script>
      // Simple password match validation
      document
        .getElementById("confirm_password")
        .addEventListener("input", function () {
          const password = document.getElementById("new_password").value;
          const confirmPassword = this.value;
          const matchMessage = document.getElementById("match-message");

          if (confirmPassword.length > 0) {
            if (password === confirmPassword) {
              this.setCustomValidity("");
              matchMessage.textContent = "✓ Passwords match";
              matchMessage.className = "text-xs mt-1 text-green-600";
              matchMessage.classList.remove("hidden");
            } else {
              this.setCustomValidity("Passwords do not match");
              matchMessage.textContent = "✗ Passwords do not match";
              matchMessage.className = "text-xs mt-1 text-red-600";
              matchMessage.classList.remove("hidden");
            }
          } else {
            this.setCustomValidity("");
            matchMessage.classList.add("hidden");
          }
        });

      // Also check when typing in the new password field
      document
        .getElementById("new_password")
        .addEventListener("input", function () {
          const confirmPassword =
            document.getElementById("confirm_password").value;
          const matchMessage = document.getElementById("match-message");

          if (confirmPassword.length > 0) {
            if (this.value === confirmPassword) {
              document.getElementById("confirm_password").setCustomValidity("");
              matchMessage.textContent = "✓ Passwords match";
              matchMessage.className = "text-xs mt-1 text-green-600";
              matchMessage.classList.remove("hidden");
            } else {
              document
                .getElementById("confirm_password")
                .setCustomValidity("Passwords do not match");
              matchMessage.textContent = "✗ Passwords do not match";
              matchMessage.className = "text-xs mt-1 text-red-600";
              matchMessage.classList.remove("hidden");
            }
          }
        });
    </script>

    <script>
      // Password visibility toggle function
      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        const eyeIcon = document.getElementById(fieldId + "_eye");

        if (field.type === "password") {
          field.type = "text";
          // Change to eye-slash icon (hidden state)
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21" />
        `;
        } else {
          field.type = "password";
          // Change back to eye icon (visible state)
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
        }
      }

      // Simple password match validation
      document
        .getElementById("confirm_password")
        .addEventListener("input", function () {
          const password = document.getElementById("new_password").value;
          const confirmPassword = this.value;
          const matchMessage = document.getElementById("match-message");

          if (confirmPassword.length > 0) {
            if (password === confirmPassword) {
              this.setCustomValidity("");
              matchMessage.textContent = "✓ Passwords match";
              matchMessage.className = "text-xs mt-1 text-green-600";
              matchMessage.classList.remove("hidden");
            } else {
              this.setCustomValidity("Passwords do not match");
              matchMessage.textContent = "✗ Passwords do not match";
              matchMessage.className = "text-xs mt-1 text-red-600";
              matchMessage.classList.remove("hidden");
            }
          } else {
            this.setCustomValidity("");
            matchMessage.classList.add("hidden");
          }
        });

      // Also check when typing in the new password field
      document
        .getElementById("new_password")
        .addEventListener("input", function () {
          const confirmPassword =
            document.getElementById("confirm_password").value;
          const matchMessage = document.getElementById("match-message");

          if (confirmPassword.length > 0) {
            if (this.value === confirmPassword) {
              document.getElementById("confirm_password").setCustomValidity("");
              matchMessage.textContent = "✓ Passwords match";
              matchMessage.className = "text-xs mt-1 text-green-600";
              matchMessage.classList.remove("hidden");
            } else {
              document
                .getElementById("confirm_password")
                .setCustomValidity("Passwords do not match");
              matchMessage.textContent = "✗ Passwords do not match";
              matchMessage.className = "text-xs mt-1 text-red-600";
              matchMessage.classList.remove("hidden");
            }
          }
        });
    </script>
  </body>
</html>
