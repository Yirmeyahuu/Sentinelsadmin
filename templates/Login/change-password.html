{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <link rel="icon" href="{% static 'assets/img/Sentinels New Logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="h-screen flex bg-gray-100">

<!-- Left Section (Image) -->
<div class="w-2/3 h-screen relative rounded-r-3xl overflow-hidden">
    <img src="{% static 'assets/img/login-bg.png' %}" alt="Background Image" class="w-full h-full object-cover">
</div>

<!-- Right Section (Change Password Form) -->
<div class="w-1/3 h-screen bg-gray-100 flex items-center justify-center rounded-l-3xl overflow-hidden">
    <div class="bg-white pl-5 pr-5 rounded-3xl w-2/3 max-w-md shadow-2xl h-[500px]">
        <div class="text-center">
            <img src="{% static 'assets/img/Sentinels New Logo.png' %}" alt="Sentinels Logo" class="mx-auto h-36 mb-8 mt-8">
        </div>
        
        <h1 class="text-center text-blue-700 text-2xl font-semibold mb-6">Change Your Password</h1>
        
        <form method="POST" action="{% url 'change_password' %}" class="space-y-6">
            {% csrf_token %}
            
            <!-- New Password Input -->
            <div class="relative">
                <label for="new_password" class="block text-blue-400 text-sm font-medium mb-2">Enter New Password</label>
                <input type="password" 
                    id="new_password" 
                    name="new_password" 
                    placeholder="New Password"
                    required
                    class="peer w-full pl-3 pr-5 py-2.5 text-gray-600 text-base border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-blue-400">
            </div>
            <!-- Confirm Password Input -->
            <div class="relative">
                <label for="confirm_password" class="block text-blue-400 text-sm font-medium mb-2">Confirm Password</label>
                <input type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    placeholder="Confirm Password"
                    required
                    class="peer w-full pl-3 pr-5 py-2.5 text-gray-600 text-base border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-blue-400">
            </div>
            
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-500 text-white text-lg font-medium py-3 rounded-2xl transition duration-200">
                Update Password
            </button>
        </form>

        <!-- Back Button -->
        <form method="POST" action="{% url 'faculty_logout' %}" class="mt-4 text-center">
            {% csrf_token %}
            <button type="submit" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 text-lg font-medium py-3 rounded-2xl transition duration-200">
                Back
            </button>
        </form>
    </div>
</div>

</body>
</html>
