{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SENTINELS | Faculty Login{% endblock %}</title>
    <link rel="icon" href="{% static 'assets/img/Sentinels Logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="h-screen flex">
    <!-- Left Section (Image) -->
    <div class="w-2/3 h-screen relative rounded-r-3xl overflow-hidden">
        <img src="{% static 'assets/img/login-bg.png' %}" alt="Background Image" class="w-full h-full object-cover">
    </div>

    <!-- Right Section (Login Form) -->
    <div class="w-1/3 h-screen bg-gray-100 flex items-center justify-center rounded-l-3xl overflow-hidden">
        <div class="bg-white pl-5 pr-5 rounded-3xl w-2/3 max-w-md shadow-2xl h-[500px]">
            <div class="text-center">
                <img src="{% static 'assets/img/Sentinels Logo Text Right.png' %}" alt="Sentinels Logo" class="mx-auto h-16 mb-16 mt-10">
            </div>

            <!-- Login Form --> 
            <form method="POST" action="{% url 'faculty_login' %}" class="space-y-5">
                {% csrf_token %}

                  <!-- Faculty ID Field -->
                <div class="relative">
                    <label for="faculty_id" class="block mb-1 text-lg font-bold text-blue-500">Faculty ID</label>
                    <input type="text" name="faculty_id" id="faculty_id" placeholder="Enter Faculty ID" required
                        class="w-full px-4 py-3 pl-10 bg-white text-black border border-gray-400 rounded-2xl focus:border-none focus:outline-none focus:ring-2 focus:ring-blue-600">
                        <span class="absolute left-3 top-11 text-blue-700">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9A3.75 3.75 0 1 1 8.25 9a3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a8.25 8.25 0 0 1 15 0"/>
                            </svg>
                        </span>
                    <span id="faculty_id_error" class="text-red-500 text-xs hidden">Faculty not authorized. Enter a different ID.</span>
                </div>

                <!-- Password Field -->
                <div class="relative">
                    <label for="faculty_password" class="block mb-1 text-lg font-bold text-blue-500">Password</label>
                    <input type="password" id="faculty_password" name="faculty_password" placeholder="Enter Password" required
                        class="w-full px-4 py-3 pl-10 bg-white text-black border border-gray-400 focus:border-none rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-600">
                    <!-- Lock Icon -->
                    <span class="absolute left-3 top-11 text-blue-700">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V7.875a4.5 4.5 0 1 0-9 0V10.5M7.5 10.5h9a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.5-1.5v-6a1.5 1.5 0 0 1 1.5-1.5Z"/>
                        </svg>
                    </span>
                    <!-- Eye Icon Button -->
                    <button type="button" id="togglePassword" class="absolute right-3 top-11 text-blue-700 focus:outline-none">
                        <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0z" />
                        </svg>
                        <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 hidden">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M9.88 9.88A3.75 3.75 0 0 0 12 15.75a3.75 3.75 0 0 0 2.12-.63m-4.24-4.24a3.75 3.75 0 0 1 5.3 5.3m-5.3-5.3L3 3m18 18" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12z" />
                        </svg>
                    </button>
                    <span id="password_error" class="text-red-500 text-xs hidden">Incorrect password. Please try again.</span>
                </div>

                <button type="submit" class="w-full bg-blue-700 text-white font-bold py-3 rounded-2xl hover:bg-blue-500">Login</button>
            </form>

            <div class="text-left mt-4">
                <a href="{% url 'superadmin_login' %}" class="text-sm text-blue-500 hover:underline">
                    Login as Super Admin
                </a>
            </div>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const errorField = "{{ error_field|escapejs }}";  // Get the error field from the context
    
            if (errorField === "faculty_id") {
                document.getElementById("faculty_id_error").classList.remove("hidden");
            } else if (errorField === "password") {
                document.getElementById("password_error").classList.remove("hidden");
            }
        });
    </script>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const passwordInput = document.getElementById('faculty_password');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
        });
        </script>

</body>
</html>
