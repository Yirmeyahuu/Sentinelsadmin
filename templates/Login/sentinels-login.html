{% load static %}
{% load tailwind_tags %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}SENTINELS | Login{% endblock %}</title>
    <link rel="icon" href="{% static 'assets/img/Sentinels New Logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="h-screen flex">
    <!-- Left Section (Image) -->
    <div class="w-2/3 h-screen relative rounded-r-3xl overflow-hidden">
        <img src="{% static 'assets/img/login-bg.png' %}" alt="Background Image" class="w-full h-full object-cover">
    </div>

    <!-- Right Section (Login Form) -->
    <div class="w-1/3 h-screen bg-gray-100 flex items-center justify-center rounded-l-3xl overflow-hidden">
        <div class="bg-white pl-5 pr-5 rounded-3xl w-2/3 max-w-md shadow-2xl h-[500px]">
            <div class="text-center">
                <img src="{% static 'assets/img/Sentinels New Logo.png' %}" alt="Sentinels Logo" class="mx-auto h-36 mb-8 mt-8">
            </div>
            
            <!-- Login Form --> 
            <form method="POST" action="{% url 'sentinels_login' %}" class="space-y-6">
                {% csrf_token %}
                
                <!-- Username/Faculty ID Input -->
                <div class="relative">
                    <!-- User Icon -->
                    <svg class="absolute left-3 top-3.5 w-4 h-4 text-blue-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" />
                    </svg>
                    <input type="text" 
                        name="username_or_id" 
                        id="username_or_id" 
                        placeholder=" "
                        required
                        class="peer w-full pl-10 pr-5 py-2.5 text-gray-600 text-base border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-blue-400 placeholder-transparent">
                        <label for="username_or_id" 
                        class="absolute left-10 -top-3 text-blue-400 text-sm transition-all ease-in-out
                                duration-500
                                bg-white px-1
                                peer-placeholder-shown:text-gray-400
                                peer-placeholder-shown:top-3.5
                                peer-focus:-top-3
                                peer-focus:text-blue-400
                                peer-focus:left-8
                                pointer-events-none">
                        Username or Faculty ID
                    </label>
                </div>

                <!-- Password Input -->
                <div class="relative">
                    <!-- Lock Icon -->
                    <svg class="absolute left-3 top-3.5 w-4 h-4 text-blue-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5z" clip-rule="evenodd" />
                    </svg>
                    <input type="password" 
                        id="password" 
                        name="password" 
                        placeholder=" "
                        required
                        class="peer w-full pl-10 pr-12 py-2.5 text-gray-600 text-base border-2 border-blue-200 rounded-2xl focus:outline-none focus:border-blue-400 placeholder-transparent">
                    <label for="password" 
                        class="absolute left-10 -top-3 text-blue-400 text-sm transition-all ease-in-out
                                duration-500
                                bg-white px-1
                                peer-placeholder-shown:text-gray-400
                                peer-placeholder-shown:top-3.5
                                peer-focus:-top-3
                                peer-focus:text-blue-400
                                peer-focus:left-8
                                pointer-events-none">
                        Password
                    </label>
                    <!-- Eye Icons for Password Toggle -->
                    <button type="button" id="togglePassword" class="absolute right-3 top-3.5 text-blue-400 hover:text-gray-600">
                        <!-- Eye Open Icon -->
                        <svg id="eyeOpen" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                            <path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" />
                        </svg>
                        <!-- Eye Closed Icon -->
                        <svg id="eyeClosed" class="w-4 h-4 hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z" />
                            <path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.53 15.713l-4.243-4.244a3.75 3.75 0 0 0 4.244 4.243Z" />
                            <path d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 0 0-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 0 1 6.75 12Z" />
                        </svg>
                    </button>
                </div>
            
                <button type="submit" class="w-full bg-blue-700 hover:bg-blue-500 text-white text-lg font-medium py-3 rounded-2xl transition duration-200">
                    Login
                </button>
            </form>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const errorField = "{{ error_field|escapejs }}";  // Get the error field from the context
    
            if (errorField === "faculty_id") {
                document.getElementById("faculty_id_error").classList.remove("hidden");
            } else if (errorField === "password") {
                document.getElementById("password_error").classList.remove("hidden");
            }
        });
    </script>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            e.preventDefault(); // Prevent form submission
            const passwordInput = document.getElementById('password');
            const eyeOpen = document.getElementById('eyeOpen');
            const eyeClosed = document.getElementById('eyeClosed');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeOpen.classList.remove('hidden');
                eyeClosed.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
